<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POSH Training Centre</title>
<style>
  :root {
    --navy: #1b2a4a;
    --navy-2: #243656;
    --ink: #1a1f2b;
    --cream: #f7f4ee;
    --card: #fffcf7;
    --gold: #a6843d;
    --gold-2: #f3e6c8;
    --rose: #7a3142;
    --green: #1f5c4d;
    --muted: #5c6573;
    --line: #e6ddd0;
    --rose-bg: #f8eeee;
    --green-bg: #e7f3ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Calibri, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--cream);
    min-height: 100vh;
  }
  button, input { font-family: inherit; }
  h1, h2, h3 { font-family: Georgia, "Palatino Linotype", serif; font-weight: normal; color: var(--navy); }
  .app { display: flex; min-height: 100vh; align-items: stretch; }
  .side {
    width: 280px;
    flex: 0 0 280px;
    background: var(--navy);
    color: white;
    padding: 28px 16px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #topicNav {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    margin-top: 4px;
  }
  #homeBtn { margin: 4px 0 10px; border: 1px solid #314566; }
  .brand {
    font-family: Georgia, serif;
    font-size: 22px;
    line-height: 1.2;
    margin: 0 8px 6px;
  }
  .brand span { display: block; color: var(--gold-2); font-size: 12px; font-family: Calibri, "Segoe UI", sans-serif; letter-spacing: 0.06em; margin-bottom: 8px; line-height: 1.35; }
  .progress-label { margin: 16px 8px 8px; color: #c9d3e4; font-size: 13px; }
  .bar { height: 6px; background: #314566; border-radius: 99px; margin: 0 8px 16px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); width: 0; }
  .nav-btn, .side a.nav-btn {
    display: flex;
    gap: 10px;
    align-items: center;
    width: 100%;
    text-align: left;
    background: transparent;
    color: #e7edf6;
    border: 0;
    border-radius: 8px;
    padding: 9px 10px;
    margin: 1px 0;
    cursor: pointer;
    text-decoration: none;
    font-size: 14.5px;
    line-height: 1.35;
  }
  .nav-btn:hover { background: var(--navy-2); }
  .nav-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .nav-btn.on { background: #314566; }
  .nav-btn .n {
    flex: 0 0 28px;
    height: 28px;
    border-radius: 6px;
    background: #314566;
    color: var(--gold-2);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
  }
  .nav-btn.done .n { background: var(--green); color: white; }
  .nav-btn small { display: block; color: #9eacc4; font-size: 11px; }
  .side-links { margin-top: 10px; border-top: 1px solid #314566; padding-top: 10px; flex: 0 0 auto; }
  .home-bar { margin: 0 0 18px; text-align: left; }
  .home-bar .btn { padding: 8px 16px; }
  main {
    flex: 1 1 auto;
    min-width: 0;
    padding: 40px 48px 72px;
  }
  .page { width: 100%; max-width: 1180px; }
  .kicker { color: var(--gold); font-weight: 700; letter-spacing: 0.12em; font-size: 12px; margin: 0 0 8px; }
  h1 { font-size: 40px; margin: 0 0 14px; line-height: 1.15; }
  h2 { font-size: 28px; margin: 32px 0 12px; }
  .lead { font-size: 19px; line-height: 1.65; max-width: none; }
  .page p, .page .read, .page .discuss { text-align: justify; hyphens: auto; }
  .page .kicker, .page .score, .page .anchor, .page .num { text-align: left; }
  .block {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 32px 34px 34px;
    margin: 0 0 28px;
    box-shadow: 0 12px 28px rgba(27, 42, 74, 0.05);
  }
  .block h2 { margin: 0 0 18px; font-size: 30px; }
  .discuss {
    font-size: 18px;
    line-height: 1.65;
    margin: 0 0 26px;
    max-width: none;
  }
  .intro h2 { margin: 28px 0 10px; font-size: 24px; }
  .intro p { margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 0; }
  .home-cards { margin: 22px 0 8px; }
  .q-card h2 { margin: 0 0 12px; font-size: 24px; }
  .topics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin: 8px 0 28px; }
  .topic-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 18px 18px 16px;
    min-height: 118px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(27, 42, 74, 0.05);
  }
  .topic-card:hover { border-color: var(--navy); }
  .topic-card .num { color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
  .topic-card h3 { margin: 8px 0 0; font-size: 18px; line-height: 1.3; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    padding: 22px 22px 20px 26px;
    position: relative;
  }
  .block > .grid .card, .home-cards .card { background: var(--card); }
  .card:before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--gold); }
  .card h3 { margin: 0 0 10px; font-size: 20px; }
  .card p, .prose p, .law p { margin: 0; line-height: 1.6; font-size: 17px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 0; }
  .col { padding: 0; }
  .col.bad { background: var(--rose-bg); }
  .col.good { background: var(--green-bg); }
  .col h3 { margin: 0; font-size: 18px; color: white; padding: 16px 18px; line-height: 1.35; }
  .col.bad h3 { background: var(--rose); }
  .col.good h3 { background: var(--green); }
  .col ul { margin: 0; padding: 18px 20px 8px 36px; }
  .col li { margin: 0 0 14px; line-height: 1.55; font-size: 17px; }
  .case { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 22px; margin: 0; align-items: start; }
  .facts { background: var(--navy); color: white; padding: 26px 26px 22px; }
  .facts h3 { color: var(--gold-2); margin: 0 0 12px; font-size: 13px; letter-spacing: 0.08em; }
  .facts p { line-height: 1.6; margin: 0 0 16px; font-size: 17px; }
  .anchor { color: var(--gold-2); font-size: 15px; line-height: 1.5; margin: 0; }
  .read { background: #fff; border: 1px solid var(--line); padding: 16px 18px; margin: 0 0 12px; line-height: 1.55; font-size: 17px; }
  .closebox { background: #f8f1e2; padding: 18px 18px 16px; }
  .closebox strong { display: block; color: var(--gold); letter-spacing: 0.06em; font-size: 12px; margin-bottom: 8px; }
  .closebox p { margin: 0; line-height: 1.55; font-size: 17px; }
  .ask-block { background: var(--navy); border-color: var(--navy); }
  .ask-block .kicker { color: var(--gold-2); }
  .ask-block p { color: #e7edf6; font-size: 18px; line-height: 1.55; margin: 0 0 18px; max-width: none; }
  .rule { display: none; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .btn {
    background: var(--navy);
    color: white;
    border: 0;
    padding: 12px 16px;
    font-size: 15px;
    cursor: pointer;
  }
  .btn.gold { background: var(--gold); color: var(--navy); font-weight: 700; }
  .btn.ghost { background: transparent; color: var(--navy); border: 1px solid var(--navy); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .q-card { background: var(--card); border: 1px solid var(--line); padding: 18px; margin-bottom: 16px; }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    background: white;
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-top: 8px;
    cursor: pointer;
    font-size: 15.5px;
  }
  .opt.on { border-color: var(--navy); background: #e8eef6; }
  .opt.right { border-color: var(--green); background: var(--green-bg); }
  .opt.wrong { border-color: var(--rose); background: var(--rose-bg); }
  .opt.locked { cursor: default; }
  .mark { margin: 10px 0 0; font-size: 15px; line-height: 1.4; }
  .mark.ok { color: var(--green); }
  .mark.no { color: var(--rose); }
  .score { font-family: Georgia, serif; font-size: 56px; margin: 0; color: var(--navy); }
  .fail { color: var(--rose); }
  .pass { color: var(--green); }
  .why { background: var(--card); border-left: 4px solid var(--green); padding: 10px 12px; margin: 8px 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input[type="text"] {
    width: 100%;
    max-width: 520px;
    border: 1px solid var(--line);
    background: white;
    padding: 10px 12px;
    font-size: 16px;
  }
  .note { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .who { margin: 0 8px 12px; color: var(--gold-2); font-size: 13px; line-height: 1.4; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 22px; max-width: 860px; }
  .field label { margin: 0 0 6px; }
  .field input { max-width: none; }
  .field.wide { grid-column: 1 / -1; }
  .fields .actions { grid-column: 1 / -1; margin-top: 4px; }
  .person { font-size: 18px; line-height: 1.55; margin: 0; }
  .law-page .lead { margin-bottom: 12px; }
  .law {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px 40px;
    margin-top: 22px;
  }
  .law h3 { margin: 0 0 8px; font-size: 22px; }
  .law p { margin: 0; max-width: none; }
  #sheet { display: none; }
  @media (max-width: 1100px) {
    .topics { grid-template-columns: 1fr 1fr; }
    main { padding: 32px 28px 56px; }
  }
  @media (max-width: 900px) {
    .app { display: block; }
    .side { width: auto; height: auto; position: relative; overflow: visible; display: block; }
    #topicNav { overflow: visible; }
    main { padding: 24px 16px 48px; }
    .grid, .split, .case, .topics, .fields, .law { grid-template-columns: 1fr; }
  }
  @media print {
    body * { visibility: hidden; }
    #sheet, #sheet * { visibility: visible; }
    #sheet {
      display: block !important;
      position: absolute;
      inset: 0;
      background: white;
    }
    .app { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <p class="brand"><span>PREVENTION OF SEXUAL HARASSMENT</span>POSH Training Centre</p>
    <button class="nav-btn" id="homeBtn" type="button"><span class="n">H</span><span>Home<small>Landing page</small></span></button>
    <div class="progress-label" id="progressLabel">0 of 15 topics passed</div>
    <div class="bar"><i id="progressBar"></i></div>
    <div class="who" id="whoLabel">Details needed before the test</div>
    <div id="topicNav"></div>
    <div class="side-links">
      <button class="nav-btn" id="lawBtn" type="button"><span class="n">L</span><span>The law on one page</span></button>
      <button class="nav-btn" id="certBtn" type="button"><span class="n">C</span><span>Certificate<small id="certState">Locked until every topic is passed</small></span></button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="sheet"></div>
<script src="course-data.js"></script>
<script>
const KEY = "posh-training-v1";
if (typeof COURSE === "undefined" || !COURSE.topics) {
  document.getElementById("main").innerHTML = '<div class="page"><h1>The course did not open.</h1><p class="lead">Keep this file in the same folder as course-data.js, then open POSH-Training-Course.html in Edge or Chrome.</p></div>';
} else {
const PASS = COURSE.passNeed;
const ASK = COURSE.askCount;

let state = load();
let view = { name: "home" };
let quiz = null;

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && raw.topics) {
      if (!raw.employee && raw.cert) {
        raw.employee = {
          name: raw.cert.name || "",
          employeeId: raw.cert.employeeId || "",
          designation: raw.cert.designation || "",
          division: raw.cert.division || "",
          org: raw.cert.org || ""
        };
      }
      return raw;
    }
  } catch (e) {}
  return { topics: {}, cert: null, employee: null };
}
function employee() {
  return state.employee || { name: "", employeeId: "", designation: "", division: "", org: "" };
}
function employeeReady() {
  const e = state.employee;
  return !!(e && e.name && e.employeeId && e.designation && e.division && e.org);
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function rec(n) { return state.topics[n] || { passed: false, attempts: 0, missed: [], score: null, debrief: null }; }
function passedCount() { return COURSE.topics.filter((t) => rec(t.n).passed).length; }
function allPassed() { return passedCount() === COURSE.topics.length; }

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function pickQuestions(topic) {
  const prior = rec(topic.n);
  const all = topic.questions.map((q, i) => ({ q: q.q, why: q.why, a: q.a, options: q.options, id: topic.n + "-" + i }));
  let chosen;
  if (!prior.attempts) {
    chosen = all.slice(0, ASK);
  } else {
    const missed = all.filter((q) => prior.missed.indexOf(q.id) !== -1);
    const rest = shuffle(all.filter((q) => prior.missed.indexOf(q.id) === -1));
    chosen = shuffle(missed.concat(rest).slice(0, ASK));
  }
  return chosen.map((q) => ({
    id: q.id,
    q: q.q,
    why: q.why,
    choice: null,
    options: shuffle(q.options.map((text, idx) => ({ text: text, correct: idx === q.a })))
  }));
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function go(next) { view = next; quiz = null; render(); window.scrollTo(0, 0); }

function renderNav() {
  const done = passedCount();
  document.getElementById("progressLabel").textContent = done + " of 15 topics passed";
  document.getElementById("progressBar").style.width = (done / 15 * 100) + "%";
  document.getElementById("certState").textContent = allPassed() ? "Ready to generate" : "Locked until every topic is passed";
  document.getElementById("whoLabel").textContent = employeeReady()
    ? state.employee.name + "  ·  " + state.employee.employeeId
    : "Details needed before the test";
  document.getElementById("homeBtn").className = "nav-btn" + (view.name === "home" ? " on" : "");
  document.getElementById("topicNav").innerHTML = COURSE.topics.map((t) => {
    const r = rec(t.n);
    const cls = "nav-btn" + (r.passed ? " done" : "") + (view.name !== "home" && view.n === t.n ? " on" : "");
    const sub = r.passed ? "<small>Passed</small>" : "";
    return '<button class="' + cls + '" type="button" data-topic="' + t.n + '"><span class="n">' + String(t.n).padStart(2, "0") + "</span><span>" + esc(t.short) + sub + "</span></button>";
  }).join("");
}

function shell(html) {
  renderNav();
  const homeBar = view.name === "home"
    ? ""
    : '<p class="home-bar"><button class="btn ghost" id="pageHome" type="button">Home</button></p>';
  document.getElementById("main").innerHTML = '<div class="page">' + homeBar + html + "</div>";
  bind();
}

function bind() {
  document.querySelectorAll("[data-topic]").forEach((btn) => {
    btn.onclick = () => go({ name: "topic", n: Number(btn.getAttribute("data-topic")) });
  });
  document.getElementById("homeBtn").onclick = () => go({ name: "home" });
  const pageHome = document.getElementById("pageHome");
  if (pageHome) pageHome.onclick = () => go({ name: "home" });
  document.getElementById("lawBtn").onclick = () => go({ name: "law" });
  document.getElementById("certBtn").onclick = () => go({ name: "cert" });
  document.querySelectorAll("[data-go]").forEach((btn) => {
    btn.onclick = () => {
      const name = btn.getAttribute("data-go");
      const n = btn.getAttribute("data-n");
      const after = btn.getAttribute("data-after");
      go({ name: name, n: n ? Number(n) : undefined, after: after || undefined });
    };
  });
  const empForm = document.getElementById("empForm");
  if (empForm) empForm.onsubmit = saveEmployee;
  const award = document.getElementById("awardCert");
  if (award) award.onclick = issueCertificate;
  const start = document.getElementById("startTest");
  if (start) start.onclick = () => startQuiz(Number(start.getAttribute("data-n")));
  document.querySelectorAll(".opt").forEach((btn) => {
    btn.onclick = () => choose(Number(btn.getAttribute("data-q")), Number(btn.getAttribute("data-o")));
  });
  const submit = document.getElementById("submitTest");
  if (submit) submit.onclick = submitQuiz;
  const printBtn = document.getElementById("printCert");
  if (printBtn) printBtn.onclick = () => window.print();
  const reset = document.getElementById("resetCourse");
  if (reset) reset.onclick = () => {
    if (confirm("This clears the employee details, topic results, and any certificate stored in this browser.")) {
      state = { topics: {}, cert: null, employee: null };
      save();
      go({ name: "home" });
    }
  };
}

function homeHtml() {
  const done = passedCount();
  const next = COURSE.topics.find((t) => !rec(t.n).passed);
  const board = COURSE.topics.map((t) => {
    const passed = rec(t.n).passed;
    return '<button class="topic-card" type="button" data-go="topic" data-n="' + t.n + '"><span class="num">TOPIC ' + String(t.n).padStart(2, "0") + (passed ? "  ·  PASSED" : "") + "</span><h3>" + esc(t.title) + "</h3></button>";
  }).join("");
  const details = employeeReady()
    ? employeeSummary()
    : '<section class="block"><p class="kicker">EMPLOYEE DETAILS</p><h2>Who is taking the POSH training and test</h2><p class="lead">Enter these once. They are kept with this training and test, and they are printed on the certificate. The questions ask for them if they are still blank.</p>' + employeeForm("Save details") + "</section>";
  return '<section class="block intro">'
    + '<p class="kicker">PREVENTION OF SEXUAL HARASSMENT</p>'
    + "<h1>POSH</h1>"
    + "<h2>What POSH is</h2>"
    + "<p>POSH is the short name for the prevention of sexual harassment of women at the workplace. The law is the Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013, and the Rules made under it. Section 2(n) defines sexual harassment as any unwelcome act or behaviour of a sexual nature, directly or by implication. That includes physical contact and advances, a demand or request for a sexual favour, a sexually coloured remark, showing pornography, and other unwelcome physical, verbal, or non-verbal conduct of a sexual nature.</p>"
    + "<h2>Why it applies</h2>"
    + "<p>The Act applies to every workplace in India. A workplace includes the office, a place visited because of the work, and transport provided for that work. It covers a woman of any age, whether or not she is on the rolls. Employee is defined widely and includes a trainee, an apprentice, a contract worker, and a volunteer. Where there are ten or more workers, the employer must constitute an Internal Committee. Where there are fewer than ten, the Local Committee is the forum. The employer also has a duty to keep the workplace safe and to tell people the consequences of sexual harassment and how to reach the Committee.</p>"
    + "<h2>Why everyone should go through it</h2>"
    + "<p>Any person at the workplace may meet this conduct, witness it, or be asked about it. This training sets out what unwelcome conduct is, what may amount to sexual harassment and what may not, how a complaint is made, what the Internal Committee does, and what must stay confidential. A manager, a colleague, and a person who may support a complainant need the same understanding. Each topic explains the concept, sets out examples, and works through a case, and then asks four questions. Three correct answers pass the topic. When every topic is passed, the course awards a certificate in the person's name, employee ID, designation, and division.</p>"
    + '<div class="actions">'
    + (next ? '<button class="btn gold" type="button" data-go="topic" data-n="' + next.n + '">' + (done ? "Continue with topic " + next.n : "Start with topic 1") + "</button>" : '<button class="btn gold" type="button" data-go="cert">Generate the certificate</button>')
    + '<button class="btn ghost" type="button" data-go="law">Read the law on one page</button>'
    + "</div></section>"
    + "<h2>The topics</h2>"
    + '<div class="topics">' + board + "</div>"
    + details
    + '<p class="note">Progress is stored in this browser only. To let a colleague take the course, give them the whole POSH-Training folder and ask them to open POSH-Training-Course.html in Edge or Chrome. course-data.js has to stay in that same folder. The slide deck is POSH-Training-Course.pptx. The printable brief is POSH-Law-One-Pager.pdf.</p>'
    + '<p class="note"><button class="btn ghost" id="resetCourse" type="button">Reset this browser’s record</button></p>';
}

function topicHtml(n) {
  const t = COURSE.topics.find((x) => x.n === n);
  const r = rec(n);
  const cards = t.cards.map((c) => '<div class="card"><h3>' + esc(c.h) + "</h3><p>" + esc(c.p) + "</p></div>").join("");
  const left = t.left.map((x) => "<li>" + esc(x) + "</li>").join("");
  const right = t.right.map((x) => "<li>" + esc(x) + "</li>").join("");
  const reads = t.caseRead.map((x) => '<div class="read">' + esc(x) + "</div>").join("");
  const status = r.passed
    ? "You have passed the questions on this topic. You can answer them again. Three correct answers out of four keep the topic passed."
    : "Select one choice on each question. The course marks it right or wrong, then scores the four answers. Three correct answers pass the topic.";
  return '<section class="block">'
    + '<p class="kicker">TOPIC ' + String(n).padStart(2, "0") + " OF 15</p>"
    + "<h1>" + esc(t.title) + "</h1>"
    + '<p class="kicker">WHAT THIS TOPIC IS ABOUT</p>'
    + '<p class="lead">' + esc(t.objective) + "</p>"
    + "</section>"
    + '<section class="block">'
    + '<p class="kicker">THE CONCEPT</p>'
    + '<p class="discuss">' + esc(t.discuss) + "</p>"
    + '<div class="grid">' + cards + "</div>"
    + "</section>"
    + '<section class="block">'
    + '<p class="kicker">EXAMPLES</p>'
    + '<div class="split"><div class="col bad"><h3>' + esc(t.leftTitle) + "</h3><ul>" + left + '</ul></div><div class="col good"><h3>' + esc(t.rightTitle) + "</h3><ul>" + right + "</ul></div></div>"
    + "</section>"
    + '<section class="block">'
    + '<p class="kicker">CASE STUDY</p>'
    + "<h2>" + esc(t.caseTitle) + "</h2>"
    + '<div class="case"><div class="facts"><h3>WHAT HAPPENED</h3><p>' + esc(t.caseFacts) + '</p><p class="anchor">' + esc(t.lawAnchor) + '</p></div><div>' + reads + '<div class="closebox"><strong>ILLUSTRATIVE READING</strong><p>' + esc(t.caseClose) + "</p></div></div></div>"
    + "</section>"
    + '<section class="block ask-block">'
    + '<p class="kicker">QUESTIONS</p>'
    + "<p>" + esc(status) + "</p>"
    + '<button class="btn gold" id="startTest" type="button" data-n="' + n + '">'
    + (r.passed ? "Answer the questions again" : "Answer the questions")
    + "</button></section>";
}

function field(id, name, label, value, wide) {
  return '<div class="field' + (wide ? " wide" : "") + '"><label for="' + id + '">' + label + '</label><input id="' + id + '" name="' + name + '" type="text" required value="' + esc(value || "") + '"></div>';
}

function employeeForm(submitLabel) {
  const e = employee();
  return '<form id="empForm" class="fields">'
    + field("nm", "name", "Full name", e.name)
    + field("eid", "employeeId", "Employee ID", e.employeeId)
    + field("ds", "designation", "Designation", e.designation)
    + field("dv", "division", "Division", e.division)
    + field("og", "org", "Organisation", e.org, true)
    + '<div class="actions"><button class="btn gold" type="submit">' + esc(submitLabel) + "</button></div></form>";
}

function employeeSummary() {
  const e = state.employee;
  return '<section class="block"><p class="kicker">EMPLOYEE DETAILS</p><h2>Who is taking the POSH training and test</h2>'
    + '<p class="person"><strong>' + esc(e.name) + "</strong><br>"
    + esc(e.designation) + "  ·  " + esc(e.division) + "<br>Employee ID " + esc(e.employeeId) + "<br>" + esc(e.org) + "</p>"
    + '<div class="actions"><button class="btn ghost" type="button" data-go="profile">Edit details</button></div></section>';
}

function profileHtml() {
  const cont = view.after === "quiz" ? "Save and continue to the questions" : "Save details";
  const lead = view.after === "quiz"
    ? "The questions open after these details are saved. The same details are printed on the certificate."
    : "These details are kept with this test and printed on the certificate.";
  return '<section class="block"><p class="kicker">EMPLOYEE DETAILS</p><h1>Who is taking the POSH training and test</h1><p class="lead">' + lead + "</p>" + employeeForm(cont) + "</section>";
}

function saveEmployee(ev) {
  ev.preventDefault();
  const data = new FormData(ev.target);
  const next = {
    name: String(data.get("name") || "").trim(),
    employeeId: String(data.get("employeeId") || "").trim(),
    designation: String(data.get("designation") || "").trim(),
    division: String(data.get("division") || "").trim(),
    org: String(data.get("org") || "").trim()
  };
  if (!next.name || !next.employeeId || !next.designation || !next.division || !next.org) return;
  state.employee = next;
  if (state.cert) {
    state.cert.name = next.name;
    state.cert.employeeId = next.employeeId;
    state.cert.designation = next.designation;
    state.cert.division = next.division;
    state.cert.org = next.org;
    state.cert.id = certId(next.name, next.employeeId, state.cert.iso);
  }
  save();
  const n = view.n;
  const after = view.after;
  if (after === "quiz" && n) startQuiz(n);
  else if (after === "cert") go({ name: "cert" });
  else go({ name: "home" });
}

function startQuiz(n) {
  if (!employeeReady()) {
    view = { name: "profile", n: n, after: "quiz" };
    quiz = null;
    render();
    window.scrollTo(0, 0);
    return;
  }
  const t = COURSE.topics.find((x) => x.n === n);
  quiz = { n: n, items: pickQuestions(t), index: 0 };
  view = { name: "quiz", n: n };
  render();
}

function choose(qi, oi) {
  if (quiz.items[qi].choice !== null) return;
  quiz.items[qi].choice = oi;
  render();
}

function quizHtml() {
  const t = COURSE.topics.find((x) => x.n === quiz.n);
  const blocks = quiz.items.map((item, qi) => {
    const locked = item.choice !== null;
    const opts = item.options.map((o, oi) => {
      let cls = "opt";
      if (locked && o.correct) cls += " right";
      else if (locked && item.choice === oi) cls += " wrong";
      if (locked) cls += " locked";
      return '<button class="' + cls + '" type="button" data-q="' + qi + '" data-o="' + oi + '">' + esc(o.text) + "</button>";
    }).join("");
    let mark = "";
    if (locked) {
      const picked = item.options[item.choice];
      if (picked.correct) mark = '<p class="mark ok">Right.</p><p class="mark">' + esc(item.why) + "</p>";
      else {
        const correct = item.options.find((o) => o.correct);
        mark = '<p class="mark no">Wrong. The right answer is: ' + esc(correct.text) + "</p><p class=\"mark\">" + esc(item.why) + "</p>";
      }
    }
    return '<div class="q-card"><p class="kicker">QUESTION ' + (qi + 1) + " OF 4</p><h2>" + esc(item.q) + "</h2>" + opts + mark + "</div>";
  }).join("");
  const ready = quiz.items.every((item) => item.choice !== null);
  return '<p class="kicker">TOPIC ' + String(t.n).padStart(2, "0") + "  ·  QUESTIONS</p>"
    + "<h1>" + esc(t.short) + "</h1>"
    + "<p class=\"lead\">Select one choice. It is marked straight away, and it cannot be changed. When all four are marked, score the topic.</p>"
    + blocks
    + '<div class="actions"><button class="btn gold" id="submitTest" type="button"' + (ready ? "" : " disabled") + ">Score this topic</button>"
    + '<button class="btn ghost" type="button" data-go="topic" data-n="' + t.n + '">Back to the topic</button></div>'
    + (ready ? "" : '<p class="note">Select a choice on each question. The score appears when all four are marked.</p>');
}

function submitQuiz() {
  const items = quiz.items;
  let score = 0;
  const missed = [];
  items.forEach((item) => {
    const ok = item.options[item.choice] && item.options[item.choice].correct;
    if (ok) score += 1;
    else missed.push(item.id);
  });
  const prev = rec(quiz.n);
  const passed = prev.passed || score >= PASS;
  const debrief = items.map((item) => {
    const correct = item.options.find((o) => o.correct);
    return { q: item.q, correct: correct.text, why: item.why, picked: item.options[item.choice].text, ok: item.options[item.choice].correct };
  });
  state.topics[quiz.n] = {
    passed: passed,
    attempts: (prev.attempts || 0) + 1,
    missed: passed ? [] : missed,
    score: prev.passed ? prev.score : score,
    debrief: debrief
  };
  if (!passed) state.cert = null;
  save();
  view = { name: "result", n: quiz.n, score: score, passed: passed, debrief: debrief, attempts: state.topics[quiz.n].attempts, kept: !!(prev.passed && score < PASS) };
  quiz = null;
  render();
}

function resultHtml() {
  const t = COURSE.topics.find((x) => x.n === view.n);
  const pct = Math.round(view.score / ASK * 100);
  const rows = view.debrief.map((d) => '<div class="why"><strong>' + esc(d.q) + "</strong><p>" + (d.ok ? "Right." : "Wrong.") + " Correct answer: " + esc(d.correct) + "</p><p>" + esc(d.why) + "</p></div>").join("");
  if (!view.passed) {
    return '<p class="kicker">TOPIC ' + String(t.n).padStart(2, "0") + "  ·  SCORE</p>"
      + '<p class="score fail">' + view.score + " / " + ASK + "</p>"
      + "<h1>This topic is not passed yet.</h1>"
      + '<p class="lead">You scored ' + view.score + " out of " + ASK + " (" + pct + "%). Three correct answers pass the topic. Read the concept and the case again, then answer the questions once more.</p>"
      + rows
      + '<div class="actions"><button class="btn gold" type="button" data-go="topic" data-n="' + t.n + '">Go back to this topic</button>'
      + '<button class="btn" id="startTest" type="button" data-n="' + t.n + '">Answer the questions again</button></div>';
  }
  const next = view.n < 15 ? view.n + 1 : null;
  const lead = view.kept
    ? "This attempt scored " + view.score + " out of " + ASK + ". You had already passed this topic, and that pass remains."
    : "You scored " + view.score + " out of " + ASK + " (" + pct + "%). These are the points the questions were teaching.";
  return '<p class="kicker">TOPIC ' + String(t.n).padStart(2, "0") + "  ·  PASSED</p>"
    + '<p class="score pass">' + view.score + " / " + ASK + "</p>"
    + "<h1>You have passed this topic.</h1>"
    + '<p class="lead">' + lead + "</p>"
    + rows
    + '<div class="actions">'
    + (next ? '<button class="btn gold" type="button" data-go="topic" data-n="' + next + '">Continue to topic ' + next + "</button>" : '<button class="btn gold" type="button" data-go="cert">Generate the certificate</button>')
    + "</div>";
}

function lawHtml() {
  return '<div class="law-page"><p class="kicker">THE LAW ON ONE PAGE</p>'
    + "<h1>The POSH law at a glance</h1>"
    + '<p class="lead">This is the Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013, and the Rules, 2013, set out for reading across the page. The same brief can be printed from POSH-Law-One-Pager.pdf.</p>'
    + '<p><a href="POSH-Law-One-Pager.pdf">Open the one-page PDF</a></p>'
    + '<div class="law">'
    + block("What the Act prohibits", "Section 2(n) includes any one or more unwelcome acts or behaviour, directly or by implication: physical contact and advances; a demand or request for sexual favours; sexually coloured remarks; showing pornography; and any other unwelcome physical, verbal or non-verbal conduct of a sexual nature. Section 3 prohibits that conduct at any workplace. Section 3(2) adds, where connected with it, a promise of preference, a threat of detriment, a threat about employment status, a hostile or offensive environment, and humiliating treatment likely to affect health or safety.")
    + block("Who and where", "An aggrieved woman is a woman of any age, employed or not. Employee is defined widely and includes trainees, apprentices, contract workers and volunteers. Workplace includes a place visited because of the work, and transport for that journey. Ten or more workers: an Internal Committee at each office. Fewer than ten: the Local Committee. The respondent need not be an employee.")
    + block("Internal Committee", "A senior woman as Presiding Officer, at least two employee members, one external member, and at least half the members women. Tenure not over three years. Removal for a breach of confidentiality, a conviction or pending criminal inquiry, disciplinary guilt or pending proceedings, or abuse of position. The vacancy is filled by fresh nomination. Where Rule 7 applies, quorum is three members including the Presiding Officer, and a legal practitioner does not represent the parties.")
    + block("Complaint and time", "Written complaint within three months, extendable by up to three months with reasons recorded. Help to write it. Conciliation only if she asks, before the inquiry, and not on the basis of money. Inquiry within 90 days. Report within 10 days, given to the parties. Employer acts within 60 days. Appeal within 90 days. Where Rule 7 applies, the respondent receives the complaint within 7 working days and replies within 10.")
    + block("Relief and redressal", "On her written request: transfer of either person, up to three months’ extra leave, or other prescribed relief, including a restraint on his writing her confidential report. If proved: misconduct action under the service rules or Rule 9, and compensation under section 15. If not proved: no action is required. That is not a finding of malice.")
    + block("Malicious complaints", "Section 14 requires a conclusion, after inquiry, that the allegation was malicious, or made knowing it to be false, or supported by a forged or misleading document. Mere inability to substantiate a complaint, or to provide adequate proof, need not attract action against her.")
    + block("Confidentiality", "Section 16 protects the complaint, the identities and addresses, the proceedings, the recommendation and the action taken, and it overrides the RTI Act. Justice having been secured may be stated without identifying her or the witnesses. Rule 12 provides for recovery of Rs 5,000. An IC member who breaches section 16 is removed.")
    + block("Employer, criminal law, and where to go", "Section 19 requires a safe workplace, display of the penal consequences and the IC order, workshops, and help if she chooses a criminal complaint. Section 26 provides a fine which may extend to Rs 50,000, with heavier consequences on a repeat conviction. Stalking, voyeurism and sexual harassment are also offences under the Bharatiya Nyaya Sanhita (sections 78, 77 and 75), in force from 1 July 2024. She may complain to the IC or, where there is none, the Local Committee. SHe-Box at shebox.wcd.gov.in forwards a complaint. It does not replace the inquiry.")
    + "</div>"
    + '<p class="note">This brief is for training. It is not legal advice. Proposals to amend the Act are not law until Parliament enacts them.</p></div>';
}

function block(title, text) {
  return "<h3>" + esc(title) + "</h3><p>" + esc(text) + "</p>";
}

function certHtml() {
  if (!allPassed()) {
    return '<section class="block"><p class="kicker">CERTIFICATE</p><h1>The certificate is not ready yet.</h1><p class="lead">It is generated when you have passed the questions on every topic. It prints the employee details saved for the test: name, employee ID, designation, division, and organisation.</p></section>';
  }
  if (!employeeReady()) {
    return '<section class="block"><p class="kicker">CERTIFICATE</p><h1>Employee details</h1><p class="lead">Enter the details to be printed on the certificate.</p>' + employeeForm("Save details") + "</section>";
  }
  const e = state.employee;
  let html = '<section class="block"><p class="kicker">CERTIFICATE</p><h1>Award the certificate</h1>'
    + '<p class="person"><strong>' + esc(e.name) + "</strong><br>" + esc(e.designation) + "  ·  " + esc(e.division) + "<br>Employee ID " + esc(e.employeeId) + "<br>" + esc(e.org) + "</p>"
    + '<div class="actions">';
  if (!state.cert) html += '<button class="btn gold" id="awardCert" type="button">Award the certificate</button>';
  html += '<button class="btn ghost" type="button" data-go="profile" data-after="cert">Edit details</button></div>'
    + '<p class="note">Check the details, then award the certificate. Print it, or save it as a PDF.</p></section>';
  if (state.cert) html += preview(state.cert);
  return html;
}

function issueCertificate() {
  const e = state.employee;
  if (!employeeReady() || !allPassed()) return;
  const today = new Date();
  const iso = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
  state.cert = {
    name: e.name,
    employeeId: e.employeeId,
    designation: e.designation,
    division: e.division,
    org: e.org,
    iso: state.cert && state.cert.iso ? state.cert.iso : iso,
    id: certId(e.name, e.employeeId, state.cert && state.cert.iso ? state.cert.iso : iso)
  };
  save();
  render();
  document.getElementById("sheet").innerHTML = certificateMarkup(state.cert);
}

function certId(name, employeeId, iso) {
  const s = (name + "|" + employeeId + "|" + iso).toUpperCase();
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0;
  return "POSH-" + iso.replace(/-/g, "") + "-" + h.toString(16).toUpperCase().padStart(4, "0").slice(-4);
}

function niceDate(iso) {
  const p = iso.split("-");
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

function certificateMarkup(c) {
  return '<div style="max-width:920px;margin:28px auto;padding:36px 42px;border:3px solid #1b2a4a;outline:1px solid #a6843d;outline-offset:-10px;background:#fffcf8;text-align:center">'
    + '<p style="letter-spacing:0.16em;color:#a6843d;font-size:13px;margin:8px 0">CERTIFICATE OF COMPLETION</p>'
    + '<h1 style="font-family:Georgia,serif;font-size:36px;margin:0 0 8px;color:#1b2a4a">POSH Training</h1>'
    + '<p style="color:#5c6573;margin:18px 0 0">This is to certify that</p>'
    + '<p style="font-family:Georgia,serif;font-size:32px;font-style:italic;margin:8px 0;color:#1b2a4a">' + esc(c.name) + "</p>"
    + '<p style="font-size:18px;margin:0">' + esc(c.designation) + "  ·  " + esc(c.division) + "</p>"
    + (c.employeeId ? '<p style="color:#5c6573;margin:6px 0 0">Employee ID ' + esc(c.employeeId) + "</p>" : "")
    + '<p style="color:#5c6573;margin:4px 0 16px">' + esc(c.org) + "</p>"
    + '<p style="font-size:16px;line-height:1.5;max-width:640px;margin:0 auto 18px">has undertaken the POSH training on the Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013 and the Rules, 2013, has passed the questions on every topic, and is awarded this certificate.</p>'
    + '<p style="margin:18px 0 0">Date of completion<br><strong>' + esc(niceDate(c.iso)) + "</strong></p>"
    + '<p>Certificate number<br><strong>' + esc(c.id) + "</strong></p>"
    + '<p style="color:#5c6573;font-size:12px;margin-top:18px">Topics passed: 15 of 15. This records completion of the awareness training. It is not a legal qualification.</p>'
    + "</div>";
}

function preview(c) {
  return '<div class="actions"><button class="btn" id="printCert" type="button">Print or save as PDF</button></div>' + certificateMarkup(c);
}

function render() {
  if (view.name === "home") shell(homeHtml());
  else if (view.name === "topic") shell(topicHtml(view.n));
  else if (view.name === "quiz") shell(quizHtml());
  else if (view.name === "result") shell(resultHtml());
  else if (view.name === "profile") shell(profileHtml());
  else if (view.name === "law") shell(lawHtml());
  else if (view.name === "cert") {
    shell(certHtml());
    if (state.cert) document.getElementById("sheet").innerHTML = certificateMarkup(state.cert);
  }
  if (view.name !== "cert") document.getElementById("sheet").innerHTML = "";
}

render();
}
</script>
</body>
</html>
