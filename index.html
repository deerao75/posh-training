<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POSH Training Centre</title>
<style>
  :root {
    --navy: #1b2a4a;
    --navy-2: #243656;
    --ink: #1a1f2b;
    --gold: #a6843d;
    --gold-2: #f3e6c8;
    --cream: #f7f4ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    background: var(--cream);
    font-family: Calibri, "Segoe UI", sans-serif;
  }
  h1, h2 { font-family: Georgia, "Palatino Linotype", serif; font-weight: normal; }
  a { color: inherit; }
  .top {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 22px 48px;
    background: var(--navy);
    color: white;
  }
  .brand { text-decoration: none; line-height: 1.1; }
  .brand small {
    display: block;
    color: var(--gold-2);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.16em;
    margin-bottom: 4px;
  }
  .brand strong {
    font-family: Georgia, "Palatino Linotype", serif;
    font-size: 34px;
    font-weight: normal;
  }
  .menu {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .menu a {
    text-decoration: none;
    color: white;
    font-size: 22px;
    padding: 10px 16px;
  }
  .menu a:hover { color: var(--gold-2); }
  .banner {
    position: relative;
    flex: 1 0 auto;
    min-height: 640px;
    display: flex;
    align-items: center;
    overflow: hidden;
    background: var(--cream);
  }
  .wash {
    position: absolute;
    top: 0;
    right: 0;
    width: 78%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
    -webkit-mask-image:
      linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.55) 16%, #000 46%),
      linear-gradient(180deg, transparent 0%, #000 8%, #000 84%, transparent 100%);
    mask-image:
      linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.55) 16%, #000 46%),
      linear-gradient(180deg, transparent 0%, #000 8%, #000 84%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
    pointer-events: none;
  }
  .hero {
    position: relative;
    z-index: 1;
    max-width: 560px;
    padding: 72px 8px 72px 48px;
    margin-left: max(48px, calc((100% - 1120px) / 2));
  }
  .hero h1 {
    margin: 0 0 28px;
    color: var(--navy);
    font-size: 48px;
    line-height: 1.15;
  }
  .btn {
    display: inline-block;
    text-decoration: none;
    background: var(--gold);
    color: var(--navy);
    font-weight: 700;
    font-size: 20px;
    padding: 14px 22px;
  }
  .foot {
    background: var(--navy);
    color: #e7edf6;
  }
  .foot-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 48px 16px;
    display: flex;
    justify-content: space-between;
    gap: 28px;
    align-items: end;
  }
  .foot h2 {
    margin: 0 0 8px;
    color: white;
    font-size: 32px;
  }
  .foot p { margin: 0; font-size: 20px; line-height: 1.45; max-width: 40rem; }
  .foot nav { display: flex; gap: 22px; }
  .foot a { color: var(--gold-2); text-decoration: none; font-size: 22px; }
  .foot a:hover { text-decoration: underline; }
  .legal {
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px 48px 22px;
    border-top: 1px solid #314566;
    color: #c9d3e4;
    font-size: 18px;
  }
  @media (max-width: 800px) {
    .top, .foot-inner, .legal { padding-left: 20px; padding-right: 20px; }
    .top { flex-wrap: wrap; padding-top: 18px; padding-bottom: 14px; }
    .brand strong { font-size: 28px; }
    .menu { width: 100%; justify-content: flex-end; }
    .menu a { font-size: 18px; padding: 8px 10px; }
    .banner { display: block; min-height: 0; }
    .hero { max-width: none; margin-left: 0; padding: 36px 20px 12px; }
    .hero h1 { font-size: 34px; }
    .wash {
      position: relative;
      width: 100%;
      height: 300px;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 42%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 42%);
    }
    .foot-inner { flex-direction: column; align-items: flex-start; }
    .foot h2 { font-size: 26px; }
    .foot p, .foot a, .legal { font-size: 18px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">
    <small>POSH</small>
    <strong>Training Centre</strong>
  </a>
  <nav class="menu" aria-label="Page">
    <a href="POSH-Law-One-Pager.pdf">The law</a>
    <a href="POSH-Training-Course.html">Start training</a>
  </nav>
</header>
<section class="banner">
  <img class="wash" src="banner.jpg" alt="">
  <div class="hero">
    <h1>Prevention of sexual harassment at the workplace.</h1>
    <a class="btn" href="POSH-Training-Course.html">Start training</a>
  </div>
</section>
<footer class="foot">
  <div class="foot-inner">
    <div>
      <h2>POSH Training Centre</h2>
      <p>A workplace course on the Sexual Harassment of Women at Workplace Act, 2013.</p>
    </div>
    <nav aria-label="Footer">
      <a href="POSH-Training-Course.html">Start training</a>
      <a href="POSH-Law-One-Pager.pdf">The law</a>
    </nav>
  </div>
  <p class="legal">Training material, not legal advice.</p>
</footer>
</body>
</html>
