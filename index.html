<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POSH Training Centre</title>
<style>
  :root {
    --navy: #1b2a4a;
    --gold: #a6843d;
    --gold-2: #f3e6c8;
    --cream: #f7f4ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: white;
    background: var(--navy);
    font-family: Calibri, "Segoe UI", sans-serif;
  }
  h1 { font-family: Georgia, "Palatino Linotype", serif; font-weight: normal; }
  a { color: inherit; }
  .banner {
    position: relative;
    flex: 1 0 auto;
    min-height: 78vh;
    display: flex;
    flex-direction: column;
    background: #152238 url("banner.jpg") center 30% / cover no-repeat;
  }
  .banner:before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(21, 34, 56, 0.88) 0%, rgba(21, 34, 56, 0.55) 46%, rgba(21, 34, 56, 0.18) 100%);
  }
  .top, .hero { position: relative; z-index: 1; }
  .top {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 22px 40px;
  }
  .brand {
    text-decoration: none;
    line-height: 1.15;
  }
  .brand small {
    display: block;
    color: var(--gold-2);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
  }
  .brand strong {
    font-family: Georgia, "Palatino Linotype", serif;
    font-size: 20px;
    font-weight: normal;
  }
  .menu {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .menu a {
    text-decoration: none;
    color: white;
    font-size: 15px;
    padding: 8px 12px;
  }
  .menu a:hover { color: var(--gold-2); }
  .hero {
    margin-top: auto;
    max-width: 720px;
    padding: 48px 40px 72px;
  }
  .hero h1 {
    margin: 0 0 22px;
    font-size: 52px;
    line-height: 1.12;
    letter-spacing: -0.02em;
  }
  .btn {
    display: inline-block;
    text-decoration: none;
    background: var(--gold);
    color: var(--navy);
    font-weight: 700;
    padding: 13px 20px;
  }
  .foot {
    background: var(--navy);
    color: #d5deec;
  }
  .foot-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 40px 12px;
    display: flex;
    justify-content: space-between;
    gap: 24px;
    align-items: end;
  }
  .foot h2 {
    margin: 0 0 6px;
    color: white;
    font-family: Georgia, "Palatino Linotype", serif;
    font-weight: normal;
    font-size: 22px;
  }
  .foot p { margin: 0; font-size: 14px; line-height: 1.45; max-width: 40rem; }
  .foot nav { display: flex; gap: 18px; }
  .foot a { color: var(--gold-2); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
  .legal {
    max-width: 1120px;
    margin: 0 auto;
    padding: 12px 40px 18px;
    border-top: 1px solid #314566;
    color: #9eacc4;
    font-size: 13px;
  }
  @media (max-width: 700px) {
    .banner:before {
      background: linear-gradient(180deg, rgba(21, 34, 56, 0.55) 0%, rgba(21, 34, 56, 0.82) 70%);
    }
    .top, .hero, .foot-inner, .legal { padding-left: 16px; padding-right: 16px; }
    .top { flex-wrap: wrap; }
    .menu { width: 100%; justify-content: flex-end; }
    .hero h1 { font-size: 36px; }
    .foot-inner { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<section class="banner">
  <header class="top">
    <a class="brand" href="index.html">
      <small>POSH</small>
      <strong>Training Centre</strong>
    </a>
    <nav class="menu" aria-label="Page">
      <a href="POSH-Law-One-Pager.pdf">The law</a>
      <a href="POSH-Training-Course.html">Start training</a>
    </nav>
  </header>
  <div class="hero">
    <h1>Prevention of sexual harassment at the workplace.</h1>
    <a class="btn" href="POSH-Training-Course.html">Start training</a>
  </div>
</section>
<footer class="foot">
  <div class="foot-inner">
    <div>
      <h2>POSH Training Centre</h2>
      <p>A workplace course on the Sexual Harassment of Women at Workplace Act, 2013.</p>
    </div>
    <nav aria-label="Footer">
      <a href="POSH-Training-Course.html">Start training</a>
      <a href="POSH-Law-One-Pager.pdf">The law</a>
    </nav>
  </div>
  <p class="legal">Training material, not legal advice.</p>
</footer>
</body>
</html>
